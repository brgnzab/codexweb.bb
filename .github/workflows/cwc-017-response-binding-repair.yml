name: CWC-017 Response Binding Repair

on:
  push:
    branches: [cwc-personal]
    paths: [.github/workflows/cwc-017-response-binding-repair.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
          fetch-depth: 0
      - name: Apply managed response observation repair
        shell: python
        run: |
          from pathlib import Path

          expected = "7cf956a128e85a27f7a4d0ac6025dbb0dd05acc9"
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != expected:
              raise SystemExit(f"unexpected parent {head}; expected {expected}")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/chatgpt-session.ts",
              '''export const CHATGPT_STOP_BUTTON_SELECTOR = '[data-testid="stop-button"]';
          export const CHATGPT_COMPLETION_ACTION_SELECTOR = 'button[data-testid="copy-turn-action-button"]';
          export const CHATGPT_ASSISTANT_TURN_SELECTOR = [
            '[data-testid^="conversation-turn-"][data-turn="assistant"]',
            '[data-testid^="conversation-turn-"][data-message-author-role="assistant"]',
            '[data-testid^="conversation-turn-"]:has([data-message-author-role="assistant"])',
          ].join(", ");
          export const CHATGPT_USER_TURN_SELECTOR = [
            '[data-testid^="conversation-turn-"][data-turn="user"]',
            '[data-testid^="conversation-turn-"][data-message-author-role="user"]',
            '[data-testid^="conversation-turn-"]:has([data-message-author-role="user"])',
          ].join(", ");''',
              '''export const CHATGPT_STOP_BUTTON_SELECTOR = '[data-testid="stop-button"], form[data-chatgpt-composer] button[type="button"][aria-label="Stop"]';
          // The grouped renderer shares a footer with the user message. Callers must still prove
          // the completion control follows the bound assistant content before declaring completion.
          export const CHATGPT_COMPLETION_ACTION_SELECTOR = 'button[data-testid="copy-turn-action-button"], [data-turn-key] .turn-action-controls button';
          export const CHATGPT_ASSISTANT_TURN_SELECTOR = [
            '[data-testid^="conversation-turn-"][data-turn="assistant"]:not([data-turn-key] *)',
            '[data-testid^="conversation-turn-"][data-message-author-role="assistant"]:not([data-turn-key] *)',
            '[data-testid^="conversation-turn-"]:has([data-message-author-role="assistant"]):not([data-turn-key] *)',
            '[data-turn-key]:has([data-conversation-role="assistant"], [data-chatgpt-agent-turn-start])',
          ].join(", ");
          export const CHATGPT_USER_TURN_SELECTOR = [
            '[data-testid^="conversation-turn-"][data-turn="user"]:not([data-turn-key] *)',
            '[data-testid^="conversation-turn-"][data-message-author-role="user"]:not([data-turn-key] *)',
            '[data-testid^="conversation-turn-"]:has([data-message-author-role="user"]):not([data-turn-key] *)',
            '[data-turn-key]:has([data-user-message-bubble])',
          ].join(", ");

          /** Resolve one assistant turn by stable renderer identity instead of DOM ordinal. */
          export function chatGptAssistantTurnSelector(identity: string): string {
            const prefix = "group:assistant:";
            return identity.startsWith(prefix)
              ? `[data-turn-key=${JSON.stringify(identity.slice(prefix.length))}]:has([data-conversation-role="assistant"], [data-chatgpt-agent-turn-start])`
              : `[data-turn-id=${JSON.stringify(identity)}], [data-testid=${JSON.stringify(identity)}]`;
          }''',
          )

          replace_once(
              "src/council/playwright-council-driver.ts",
              '''  CHATGPT_USER_TURN_SELECTOR,
            assertAuthenticatedChatGptPage,''',
              '''  CHATGPT_USER_TURN_SELECTOR,
            assertAuthenticatedChatGptPage,
            chatGptAssistantTurnSelector,''',
          )

          old_answer = '''async function currentAnswerText(responseTurn: Locator): Promise<string> {
            return await responseTurn.evaluate(element => {
              const root = element as HTMLElement;
              const rendered = [...root.querySelectorAll<HTMLElement>(".markdown")]
                .filter(candidate => !candidate.parentElement?.closest(".markdown"))
                .filter(candidate => candidate.closest("[data-streaming-response-status]") === null)
                .filter(candidate => {
                  const style = getComputedStyle(candidate);
                  const bounds = candidate.getBoundingClientRect();
                  return candidate.isConnected && bounds.width > 0 && bounds.height > 0 && style.display !== "none" && style.visibility !== "hidden";
                });
              return rendered.map(candidate => candidate.innerText.trim()).filter(Boolean).join("\\n\\n").trim();
            }).catch(() => "");
          }'''

          new_answer = '''interface CouncilTurnDomState {
            turnIdentities: string[];
            userIdentities: string[];
            responseIdentities: string[];
          }

          interface CouncilResponseBinding {
            identity: string;
            locator: Locator;
            acceptedTurnIdentities: readonly string[];
          }

          export function councilNewTurnIdentity(initial: readonly string[], current: readonly string[]): string | undefined {
            const previous = new Set(initial);
            const added = current.filter(identity => !previous.has(identity));
            if (added.length > 1) throw new Error(`ChatGPT exposed ${added.length} new conversation turns for one submitted message`);
            return added[0];
          }

          export function councilReboundTurnIdentity(initial: readonly string[], boundIdentity: string, current: readonly string[]): string | undefined {
            if (current.includes(boundIdentity)) return boundIdentity;
            return councilNewTurnIdentity(initial, current);
          }

          async function councilTurnDomState(page: Page): Promise<CouncilTurnDomState> {
            return await page.evaluate(({ userSelector, assistantSelector }) => {
              const unique = (values: Array<string | null | undefined>, label: string) => {
                const clean = values.filter((value): value is string => Boolean(value));
                if (new Set(clean).size !== clean.length) throw new Error(`ChatGPT exposed duplicate ${label} identities`);
                return clean;
              };
              const legacyIdentity = (element: Element) =>
                element.getAttribute("data-turn-id")
                ?? element.getAttribute("data-testid")
                ?? element.closest("[data-turn-id-container]")?.getAttribute("data-turn-id-container");
              const legacy = (selector: string) => [...document.querySelectorAll(selector)].filter(element => !element.closest("[data-turn-key]"));
              const userIdentities = unique(legacy(userSelector).map(legacyIdentity), "user turn");
              const responseIdentities = unique(legacy(assistantSelector).map(legacyIdentity), "assistant turn");
              const turnIdentities = [...new Set([...userIdentities, ...responseIdentities])];
              const groups = [...document.querySelectorAll<HTMLElement>("[data-turn-key]")];
              const keys = unique(groups.map(group => group.getAttribute("data-turn-key")), "group turn");
              groups.forEach((group, index) => {
                const key = keys[index]!;
                const user = `group:user:${key}`;
                const assistant = `group:assistant:${key}`;
                // Keep both roles in the baseline even when Activity temporarily unmounts one.
                turnIdentities.push(user, assistant);
                if (group.querySelector("[data-user-message-bubble]")) userIdentities.push(user);
                if (group.querySelector('[data-conversation-role="assistant"], [data-chatgpt-agent-turn-start]')) responseIdentities.push(assistant);
              });
              return {
                turnIdentities: [...new Set(turnIdentities)],
                userIdentities: [...new Set(userIdentities)],
                responseIdentities: [...new Set(responseIdentities)],
              };
            }, { userSelector: CHATGPT_USER_TURN_SELECTOR, assistantSelector: CHATGPT_ASSISTANT_TURN_SELECTOR });
          }

          async function responseMatchesSubmittedPrompt(locator: Locator, prompt: string): Promise<boolean> {
            return await locator.evaluate((group, submitted) => {
              if (!(group instanceof HTMLElement) || !group.hasAttribute("data-turn-key")) return false;
              const bubbles = group.querySelectorAll<HTMLElement>("[data-user-message-bubble]");
              const contents = bubbles.length === 1 ? bubbles[0]!.querySelectorAll<HTMLElement>("[data-search-result-target]") : [];
              const normalize = (text: string) => text.replace(/\\r\\n?/g, "\\n");
              return contents.length === 1 && normalize(contents[0]!.innerText) === normalize(submitted);
            }, prompt).catch(() => false);
          }

          async function reconcileCouncilResponseBinding(
            page: Page,
            baseline: CouncilTurnDomState,
            prompt: string,
            binding: CouncilResponseBinding | undefined,
            acceptedUserIdentity?: string,
          ): Promise<{ binding?: CouncilResponseBinding; state: CouncilTurnDomState }> {
            const state = await councilTurnDomState(page);
            if (!binding) {
              const identity = councilNewTurnIdentity(baseline.turnIdentities, state.responseIdentities);
              return {
                binding: identity ? { identity, locator: page.locator(chatGptAssistantTurnSelector(identity)), acceptedTurnIdentities: state.turnIdentities } : undefined,
                state,
              };
            }

            const boundCount = await binding.locator.count();
            if (boundCount === 1) return { binding, state };
            if (boundCount > 1) throw new Error(`ChatGPT exposed ${boundCount} DOM nodes for the bound assistant turn`);

            const acceptedTurns = new Set(binding.acceptedTurnIdentities);
            const identity = councilReboundTurnIdentity(baseline.turnIdentities, binding.identity, state.responseIdentities);
            const newUsers = state.userIdentities.filter(item => !baseline.turnIdentities.includes(item));
            const user = newUsers[0];
            const replacement = Boolean(identity && user && newUsers.length === 1
              && binding.identity.startsWith("group:assistant:")
              && user.startsWith("group:user:")
              && identity === `group:assistant:${user.slice("group:user:".length)}`
              && !state.turnIdentities.includes(binding.identity)
              && state.turnIdentities.every(turn => baseline.turnIdentities.includes(turn) || acceptedTurns.has(turn) || turn === user || turn === identity));

            let matches = false;
            if (replacement && identity && user) {
              const locator = page.locator(chatGptAssistantTurnSelector(identity));
              matches = acceptedUserIdentity ? user === acceptedUserIdentity : await responseMatchesSubmittedPrompt(locator, prompt);
              if (matches) return { binding: { identity, locator, acceptedTurnIdentities: state.turnIdentities }, state };
            }
            throw new Error("ChatGPT opened another user turn while the bound assistant response was detached");
          }

          async function currentResponseObservation(responseTurn: Locator): Promise<{ text: string; completion: boolean }> {
            return await responseTurn.evaluate((element, completionSelector) => {
              const root = element as HTMLElement;
              const rendered = (candidate: HTMLElement) => {
                const style = getComputedStyle(candidate);
                const bounds = candidate.getBoundingClientRect();
                return candidate.isConnected && bounds.width > 0 && bounds.height > 0 && style.display !== "none" && style.visibility !== "hidden";
              };
              // ChatGPT's newer DIL/Activity renderers no longer guarantee a .markdown wrapper.
              const answerRootSelector = '.markdown, [data-message-author-role="assistant"] .puik-root.not-markdown > [class*="_DilResponseRoot"], [data-markdown-text-style="assistant-message"]';
              const activityContainers = [...root.querySelectorAll<HTMLElement>("[data-chatgpt-agent-turn-start]")]
                .map(marker => marker.parentElement)
                .filter((node): node is HTMLElement => Boolean(node));
              const answers = [...root.querySelectorAll<HTMLElement>(answerRootSelector)]
                .filter(candidate => candidate.closest("[data-streaming-response-status]") === null)
                .filter(candidate => {
                  if (!root.hasAttribute("data-turn-key") && !candidate.hasAttribute("data-markdown-text-style")) return true;
                  const unit = candidate.closest("[data-content-search-unit-key]");
                  return unit
                    ? Array.from(unit.children).some(child => child.getAttribute("data-conversation-role") === "assistant")
                    : activityContainers.some(container => container.contains(candidate));
                })
                .filter(rendered);
              const text = answers.map(candidate => candidate.innerText.trim()).filter(Boolean).join("\\n\\n").trim();
              const actions = [...root.querySelectorAll<HTMLElement>(completionSelector)].filter(rendered);
              const lastAnswer = answers.at(-1);
              const completion = root.hasAttribute("data-turn-key")
                ? Boolean(lastAnswer && actions.some(action => Boolean(lastAnswer.compareDocumentPosition(action) & Node.DOCUMENT_POSITION_FOLLOWING)))
                : actions.length > 0;
              return { text, completion };
            }, CHATGPT_COMPLETION_ACTION_SELECTOR).catch(() => ({ text: "", completion: false }));
          }'''
          replace_once("src/council/playwright-council-driver.ts", old_answer, new_answer)

          old_send = '''  const assistantTurns = page.locator(CHATGPT_ASSISTANT_TURN_SELECTOR);
            const userTurns = page.locator(CHATGPT_USER_TURN_SELECTOR);
            const initialAssistantCount = await assistantTurns.count();
            const initialUserCount = await userTurns.count();
            const responseTurn = assistantTurns.nth(initialAssistantCount);
            const send = composer.locator("xpath=ancestor::form[1]").getByTestId("send-button");
            await send.waitFor({ state: "visible", timeout: 20_000 });
            if (!await send.isEnabled()) throw new Error("ChatGPT Council send button is disabled after prompt attachment");
            const submittedAt = Date.now();
            phase(onPhase, onExecution, "submit-started");
            await send.press("Enter");

            const submissionDeadline = Date.now() + SUBMISSION_TIMEOUT_MS;
            let submissionObserved = false;
            while (Date.now() < submissionDeadline) {
              abortIfNeeded(signal);
              const [users, assistants, running] = await Promise.all([
                userTurns.count(),
                assistantTurns.count(),
                page.locator(CHATGPT_STOP_BUTTON_SELECTOR).filter({ visible: true }).count(),
              ]);
              if (users > initialUserCount || assistants > initialAssistantCount || running > 0) {
                submissionObserved = true;
                phase(onPhase, onExecution, "submit-observed");
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 50));
            }
            if (!submissionObserved) throw new Error("ChatGPT Council did not accept the submitted prompt");'''

          new_send = '''  const baseline = await councilTurnDomState(page);
            const send = composer.locator("xpath=ancestor::form[1]").getByTestId("send-button");
            await send.waitFor({ state: "visible", timeout: 20_000 });
            if (!await send.isEnabled()) throw new Error("ChatGPT Council send button is disabled after prompt attachment");
            const submittedAt = Date.now();
            phase(onPhase, onExecution, "submit-started");
            await send.press("Enter");

            const submissionDeadline = Date.now() + SUBMISSION_TIMEOUT_MS;
            let submissionObserved = false;
            let acceptedUserIdentity: string | undefined;
            let responseBinding: CouncilResponseBinding | undefined;
            while (Date.now() < submissionDeadline) {
              abortIfNeeded(signal);
              const state = await councilTurnDomState(page);
              const newUsers = state.userIdentities.filter(identity => !baseline.turnIdentities.includes(identity));
              if (newUsers.length > 1) throw new Error(`ChatGPT exposed ${newUsers.length} new user turns for one submitted message`);
              acceptedUserIdentity ??= newUsers[0];
              const identity = councilNewTurnIdentity(baseline.turnIdentities, state.responseIdentities);
              if (identity) responseBinding = { identity, locator: page.locator(chatGptAssistantTurnSelector(identity)), acceptedTurnIdentities: state.turnIdentities };
              const running = await page.locator(CHATGPT_STOP_BUTTON_SELECTOR).filter({ visible: true }).count();
              if (acceptedUserIdentity || responseBinding || running > 0) {
                submissionObserved = true;
                phase(onPhase, onExecution, "submit-observed");
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 50));
            }
            if (!submissionObserved) throw new Error("ChatGPT Council did not accept the submitted prompt");'''
          replace_once("src/council/playwright-council-driver.ts", old_send, new_send)

          old_loop = '''    const now = Date.now();
              const present = await responseTurn.count() > 0;
              const text = present ? await currentAnswerText(responseTurn) : "";
              if (text !== lastText) {
                lastText = text;
                lastAssistantMutationAt = now;
              }
              const [running, completion, waitingUser] = await Promise.all([
                page.locator(CHATGPT_STOP_BUTTON_SELECTOR).filter({ visible: true }).count().then(count => count > 0),
                present ? responseTurn.locator(CHATGPT_COMPLETION_ACTION_SELECTOR).filter({ visible: true }).count().then(count => count > 0) : Promise.resolve(false),
                genericUserInputRequired(page),
              ]);'''

          new_loop = '''    const now = Date.now();
              const reconciled = await reconcileCouncilResponseBinding(page, baseline, prompt, responseBinding, acceptedUserIdentity);
              responseBinding = reconciled.binding;
              const present = Boolean(responseBinding && await responseBinding.locator.count() === 1);
              const observation = present ? await currentResponseObservation(responseBinding!.locator) : { text: "", completion: false };
              const text = observation.text;
              if (text !== lastText) {
                lastText = text;
                lastAssistantMutationAt = now;
              }
              const [running, waitingUser] = await Promise.all([
                page.locator(CHATGPT_STOP_BUTTON_SELECTOR).filter({ visible: true }).count().then(count => count > 0),
                genericUserInputRequired(page),
              ]);
              const completion = observation.completion;'''
          replace_once("src/council/playwright-council-driver.ts", old_loop, new_loop)

          replace_once(
              "src/council/chatgpt-deep-state.ts",
              '''  if (domHealth.missingResponseSince && now - domHealth.missingResponseSince >= t.responseDomGraceMs) {''',
              '''  // Activity/Power UI may temporarily unmount the assistant container while a live Stop/generation
            // signal still proves the same submitted turn is running. Do not manufacture DOM drift from that
            // renderer churn; once liveness ends, the ordinary grace check becomes authoritative again.
            if (domHealth.missingResponseSince && !running && now - domHealth.missingResponseSince >= t.responseDomGraceMs) {''',
          )

          Path("tests/council-playwright-response-binding.test.ts").write_text(r'''import { describe, expect, test } from "bun:test";
          import {
            CHATGPT_ASSISTANT_TURN_SELECTOR,
            CHATGPT_COMPLETION_ACTION_SELECTOR,
            CHATGPT_USER_TURN_SELECTOR,
            chatGptAssistantTurnSelector,
          } from "../src/chatgpt-session";
          import { councilNewTurnIdentity, councilReboundTurnIdentity } from "../src/council/playwright-council-driver";
          import { deriveCouncilChatGptState } from "../src/council/chatgpt-deep-state";

          describe("Council ChatGPT response binding", () => {
            test("current selectors include grouped Activity/DIL turn surfaces without nesting legacy turns", () => {
              expect(CHATGPT_ASSISTANT_TURN_SELECTOR).toContain("data-turn-key");
              expect(CHATGPT_ASSISTANT_TURN_SELECTOR).toContain("data-chatgpt-agent-turn-start");
              expect(CHATGPT_USER_TURN_SELECTOR).toContain("data-user-message-bubble");
              expect(CHATGPT_COMPLETION_ACTION_SELECTOR).toContain("turn-action-controls");
              expect(chatGptAssistantTurnSelector("group:assistant:abc")).toContain('data-turn-key="abc"');
              expect(chatGptAssistantTurnSelector("conversation-turn-7")).toContain('data-testid="conversation-turn-7"');
            });

            test("new turn binding rejects competing responses and rebinds one detached replacement only", () => {
              const baseline = ["old-user", "old-assistant"];
              expect(councilNewTurnIdentity(baseline, [...baseline, "group:assistant:temp"])).toBe("group:assistant:temp");
              expect(() => councilNewTurnIdentity(baseline, [...baseline, "a", "b"])).toThrow("2 new conversation turns");
              expect(councilReboundTurnIdentity(baseline, "group:assistant:temp", ["group:assistant:temp"])).toBe("group:assistant:temp");
              expect(councilReboundTurnIdentity(baseline, "group:assistant:temp", [...baseline, "group:assistant:persisted"])).toBe("group:assistant:persisted");
            });

            test("missing bound response does not become DOM_DRIFT while generation is still positively live", () => {
              const started = 1_000;
              const first = deriveCouncilChatGptState({
                responsePresent: true,
                assistantText: "working",
                generationRunning: true,
                stopVisible: true,
                rateLimited: false,
                conversationLimit: false,
                connectionLost: false,
                terminalError: false,
              }, { submittedAt: started }, undefined, started);
              const duringActivity = deriveCouncilChatGptState({
                responsePresent: false,
                generationRunning: true,
                stopVisible: true,
                rateLimited: false,
                conversationLimit: false,
                connectionLost: false,
                terminalError: false,
              }, { submittedAt: started }, first, started + 90_000, { responseDomGraceMs: 1_000 });
              expect(duringActivity.state).not.toBe("DOM_DRIFT");
              const stopped = deriveCouncilChatGptState({
                responsePresent: false,
                generationRunning: false,
                stopVisible: false,
                rateLimited: false,
                conversationLimit: false,
                connectionLost: false,
                terminalError: false,
              }, { submittedAt: started }, duringActivity, started + 92_000, { responseDomGraceMs: 1_000 });
              expect(stopped.state).toBe("DOM_DRIFT");
            });
          });
          ''', encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
          changed = subprocess.check_output(["git", "status", "--short"], text=True)
          print(changed)
          required = {
              "src/chatgpt-session.ts",
              "src/council/playwright-council-driver.ts",
              "src/council/chatgpt-deep-state.ts",
              "tests/council-playwright-response-binding.test.ts",
              ".github/workflows/cwc-017-response-binding-repair.yml",
          }
          observed = {line[3:] for line in changed.splitlines() if line.strip()}
          if observed != required:
              raise SystemExit(f"unexpected patch shape: {observed}")
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chatgpt-session.ts src/council/playwright-council-driver.ts src/council/chatgpt-deep-state.ts tests/council-playwright-response-binding.test.ts
          git commit -m "fix: track managed Council response across renderer churn"
          git push origin HEAD:cwc-personal

  validate:
    needs: patch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen launcher install
        run: bun install --cwd launcher --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused response-binding regressions
        run: bun test tests/council-playwright-response-binding.test.ts tests/council-chatgpt-deep-state.test.ts tests/council-playwright-prompt.test.ts tests/council-node-playwright-helper.test.ts tests/council-browser-transport.test.ts tests/council-execution-browser-integration.test.ts tests/council-autonomy-errors.test.ts tests/council-launcher-turn-control.test.ts tests/council-playwright-surface.test.ts
      - name: Full verify
        run: bun run verify
      - name: Direct Node helper CDP regression
        run: node scripts/qa-cwc-council-helper-cdp.mjs
      - name: Local Council runtime security smoke
        run: node scripts/qa-cwc-local-runtime.mjs
      - name: Integrity
        shell: pwsh
        run: |
          git diff --exit-code -- bun.lock launcher/bun.lock
          if (git status --short) {
            git status --short
            throw "Tracked worktree changed during CWC-017 response-binding validation"
          }
