name: CWC-013 Owner Schema Retest

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install root
        run: bun install --frozen-lockfile
      - name: Frozen install launcher
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Root typecheck
        run: bun run typecheck
      - name: Focused CWC-013 owner security tests
        run: bun test tests/council-owner-http-security.test.ts tests/cwc-security-preservation.test.ts
      - name: Root tests
        run: bun run test
      - name: Launcher typecheck
        run: bun run launcher:typecheck
      - name: Launcher active tests
        run: bun run launcher:test
