name: CWC-012 Repair Validation

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install root
        run: bun install --frozen-lockfile
      - name: Frozen install launcher
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Version contract
        run: bun run check-version
      - name: Root typecheck
        run: bun run typecheck
      - name: Root tests
        run: bun run test
      - name: Launcher typecheck
        run: bun run launcher:typecheck
      - name: Launcher tests
        run: bun run launcher:test
      - name: Launcher build
        run: bun run launcher:build
      - name: Runtime bundle
        run: bun run --cwd launcher build:runtime
      - name: Prepare Windows baseline Bun
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.3.14 -GitHubEnv $env:GITHUB_ENV
      - name: Package
        run: bun run app:package
      - name: Packaged smoke
        run: bun run app:smoke
