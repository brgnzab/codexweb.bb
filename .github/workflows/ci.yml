name: CI

on:
  push:
    branches: [main, cwc-personal]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.3.14 -GitHubEnv $env:GITHUB_ENV
      - name: Full source verification
        if: github.ref == 'refs/heads/main'
        run: bun run verify
      - name: CWC Personal accepted-source gate
        if: github.ref == 'refs/heads/cwc-personal'
        shell: pwsh
        run: |
          bun test tests/project-relay.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tests/project-relay-owner-control.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tests/project-relay-ui-contract.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run launcher:typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run launcher:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # GitHub's Windows runner executes elevated, which makes newly created temp paths
          # owned by the Administrators group. The launcher security contract intentionally
          # requires the current user SID, so execute launcher QA as an ordinary local user
          # instead of weakening the production ACL checks.
          $qaUser = "cwcqa"
          Remove-LocalUser -Name $qaUser -ErrorAction SilentlyContinue
          $qaPasswordText = "R7!x" + [Guid]::NewGuid().ToString("N") + "#K9z"
          $qaPassword = ConvertTo-SecureString $qaPasswordText -AsPlainText -Force
          $qaCredential = [pscredential]::new("$env:COMPUTERNAME\$qaUser", $qaPassword)
          New-LocalUser -Name $qaUser -Password $qaPassword -PasswordNeverExpires | Out-Null
          $qaIdentity = "$env:COMPUTERNAME\$qaUser"
          $qaScript = Join-Path $env:RUNNER_TEMP "cwc-launcher-source-qa.ps1"
          $qaStdout = "C:\Users\Public\cwc-launcher-source-qa.stdout.txt"
          $qaStderr = "C:\Users\Public\cwc-launcher-source-qa.stderr.txt"
          $qaBin = "C:\Users\Public\cwc-qa-bin"
          Remove-Item -LiteralPath $qaBin -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $qaBin -Force | Out-Null
          $bun = Join-Path $qaBin "bun.exe"
          Copy-Item -LiteralPath (Get-Command bun).Source -Destination $bun -Force
          $node = (Get-Command node).Source
          $embeddedBun = $env:CODEX_CHATGPT_WEB_EMBEDDED_BUN
          @'
          param([string]$Workspace, [string]$Node, [string]$Bun, [string]$EmbeddedBun)
          $ErrorActionPreference = "Stop"
          $qaTemp = Join-Path "C:\Users\Public" ("cwc-source-qa-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $qaTemp -Force | Out-Null
          $env:TEMP = $qaTemp
          $env:TMP = $qaTemp
          $env:PATH = "$(Split-Path -Parent $Bun);$(Split-Path -Parent $Node);$env:PATH"
          if ($EmbeddedBun) { $env:CODEX_CHATGPT_WEB_EMBEDDED_BUN = $EmbeddedBun }
          Set-Location $Workspace
          & $Node --test launcher/tests/startup-prewarm.test.cjs launcher/tests/project-relay-cache.test.cjs launcher/tests/codex-controller-wake.test.cjs launcher/tests/fresh-state.test.cjs launcher/tests/runtime-install.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location (Join-Path $Workspace "launcher")
          try {
            & $Node "scripts/test-active.cjs"
            exit $LASTEXITCODE
          } finally {
            Pop-Location
          }
          '@ | Set-Content -LiteralPath $qaScript -Encoding UTF8
          & icacls.exe $env:GITHUB_WORKSPACE /grant:r "${qaIdentity}:(OI)(CI)(RX)" /T /C /Q | Out-Null
          & icacls.exe $qaScript /grant:r "${qaIdentity}:(R)" /Q | Out-Null
          & icacls.exe $qaBin /grant:r "${qaIdentity}:(OI)(CI)(RX)" /T /C /Q | Out-Null
          try {
            $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $qaCredential -WorkingDirectory "C:\Users\Public" -ArgumentList @("-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", $qaScript, "-Workspace", $env:GITHUB_WORKSPACE, "-Node", $node, "-Bun", $bun, "-EmbeddedBun", $embeddedBun) -RedirectStandardOutput $qaStdout -RedirectStandardError $qaStderr -Wait -PassThru
            if (Test-Path $qaStdout) { Get-Content $qaStdout }
            if (Test-Path $qaStderr) { Get-Content $qaStderr | ForEach-Object { Write-Host $_ } }
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          } finally {
            Remove-LocalUser -Name $qaUser -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $qaBin -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $qaStdout,$qaStderr -Force -ErrorAction SilentlyContinue
          }
      - run: bun run app:package
        if: github.ref == 'refs/heads/main'
      - name: Native packaged smoke
        if: github.ref == 'refs/heads/main'
        run: bun run app:smoke
      - name: Validate portable artifact structure
        if: github.ref == 'refs/heads/main'
        run: bun run --cwd launcher validate:portable
      - name: Retain packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-Windows-X64-${{ github.sha }}
          path: launcher/artifacts/smoke-diagnostics-*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified portable package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-Windows-X64-${{ github.sha }}
          path: |
            launcher/artifacts/*-portable.zip
            launcher/artifacts/*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 7

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
