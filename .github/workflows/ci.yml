name: CI

on:
  push:
    branches: [main, cwc-personal]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.3.14 -GitHubEnv $env:GITHUB_ENV
      - name: Full source verification
        if: github.ref == 'refs/heads/main'
        run: bun run verify
      - name: CWC Personal accepted-source gate
        if: github.ref == 'refs/heads/cwc-personal'
        shell: pwsh
        run: |
          bun test tests/project-relay.test.ts
          bun test tests/project-relay-owner-control.test.ts
          bun test tests/project-relay-ui-contract.test.ts
          bun test
          bun run typecheck
          bun run launcher:typecheck
          bun run launcher:build
          bun run launcher:test
      - run: bun run app:package
        if: github.ref == 'refs/heads/main'
      - name: Native packaged smoke
        if: github.ref == 'refs/heads/main'
        run: bun run app:smoke
      - name: Validate portable artifact structure
        if: github.ref == 'refs/heads/main'
        run: bun run --cwd launcher validate:portable
      - name: Retain packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics-Windows-X64-${{ github.sha }}
          path: launcher/artifacts/smoke-diagnostics-*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified portable package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-Windows-X64-${{ github.sha }}
          path: |
            launcher/artifacts/*-portable.zip
            launcher/artifacts/*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 7

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -config-file .github/actionlint.yaml .github/workflows/*.yml
