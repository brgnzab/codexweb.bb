name: CWC-015 Decision Gate Repair

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cwc-personal
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply decision-gate repair and regression
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          manager_path = Path("src/council/agent-manager.ts")
          manager = manager_path.read_text(encoding="utf-8")
          import_anchor = 'import type { CouncilBrowserTransport, CouncilExecutionObserver, CouncilPromptAttachment } from "./browser-transport";'
          gate_import = 'import { assertCouncilDecisionGate } from "./decision-gate";'
          if gate_import not in manager:
              if import_anchor not in manager:
                  raise SystemExit("agent-manager import anchor missing")
              manager = manager.replace(import_anchor, import_anchor + "\n" + gate_import, 1)
          decision_anchor = '          case "FINAL_DECISION":\n            this.council.decide('
          decision_repair = '          case "FINAL_DECISION":\n            assertCouncilDecisionGate(this.council.snapshot(), action.room_id);\n            this.council.decide('
          if decision_repair not in manager:
              if decision_anchor not in manager:
                  raise SystemExit("FINAL_DECISION anchor missing")
              manager = manager.replace(decision_anchor, decision_repair, 1)
          manager_path.write_text(manager, encoding="utf-8")

          test_path = Path("tests/council-managed-runtime.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          test_name = 'manager model FINAL_DECISION enforces the shared readiness gate without Council mutation'
          if test_name not in tests:
              block = r'''
            test("manager model FINAL_DECISION enforces the shared readiness gate without Council mutation", async () => {
              const root = mkdtempSync(join(tmpdir(), "managed-runtime-decision-gate-"));
              try {
                const council = new CouncilStore(join(root, "state.json"));
                council.joinAgent({ id: "alice", name: "Alice", role: "Lead" });
                const managed = new ManagedAgentStateStore(join(root, "agents.json"));
                const runtime = new CouncilManagedRuntime({
                  council,
                  managed,
                  project: new ManagedProjectStateStore(join(root, "project.json")),
                  registry: new CouncilAgentRegistry(),
                  transport: {
                    async run() {
                      return { answer: "Finalize immediately", conversationUrl: "https://chatgpt.com/c/alice", resumed: false };
                    },
                    async release() { return true; },
                  } as any,
                  parseAnswer: (() => ({
                    visibleText: "Finalize immediately",
                    batch: {
                      version: 1 as const,
                      actions: [{
                        type: "FINAL_DECISION" as const,
                        room_id: "core",
                        title: "Unsafe premature decision",
                        policy: "Ship without deliberation",
                        rationale: "Model requested finalization before any proposal",
                        accepted_arguments: [],
                        rejected_arguments: [],
                        unresolved_risks: [],
                      }],
                    },
                  })) as any,
                });
                runtime.startProject("alice", { roomId: "core", name: "Core", mission: "Build safely", mandate: "Lead deliberation" });
                const before = council.snapshot();

                await expect(runtime.runManagerObservation("alice", "Observe current state", []))
                  .rejects.toThrow(/final decision gate is not ready|proposal/i);

                expect(council.snapshot()).toEqual(before);
                expect(council.snapshot().decisions).toHaveLength(0);
              } finally { rmSync(root, { recursive: true, force: true }); }
            });
          '''
              marker = "\n\n});"
              pos = tests.rfind(marker)
              if pos < 0:
                  raise SystemExit("managed-runtime describe terminator missing")
              tests = tests[:pos] + "\n" + block.rstrip() + tests[pos:]
              test_path.write_text(tests, encoding="utf-8")
          '@ | python -

          git diff -- src/council/agent-manager.ts tests/council-managed-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/council/agent-manager.ts tests/council-managed-runtime.test.ts
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: enforce decision readiness on model action footer"
            git push origin HEAD:cwc-personal
          }
          Write-Host "REPAIR_HEAD=$(git rev-parse HEAD)"

      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen launcher install
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Focused decision and hostile-content regressions
        run: bun test tests/council-managed-runtime.test.ts tests/council-agent-manager.test.ts tests/council-decision-gate.test.ts tests/council-browser-actions.test.ts tests/council-execution-policy.test.ts tests/council-resurrection.test.ts tests/council-security.test.ts tests/cwc-security-preservation.test.ts

      - name: Full verify
        run: bun run verify

      - name: Final integrity
        shell: pwsh
        run: |
          git status --short
          git diff --exit-code -- bun.lock launcher/bun.lock
          Write-Host "VALIDATED_HEAD=$(git rev-parse HEAD)"
