name: CWC-016 Source Run Validation

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frozen root install
        run: bun install --frozen-lockfile

      - name: Frozen launcher install
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: PowerShell source-launch preflight
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start-cwc.ps1 -ValidateOnly -SkipInstall

      - name: Source-launch contract
        run: bun test tests/cwc-source-launch.test.ts

      - name: Full verify
        run: bun run verify

      - name: Final integrity
        shell: powershell
        run: |
          git status --short
          git diff --exit-code -- bun.lock launcher/bun.lock
