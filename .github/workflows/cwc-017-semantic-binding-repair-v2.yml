name: CWC-017 Semantic Response Binding Repair v2

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
          fetch-depth: 0
      - name: Apply semantic assistant binding repair
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          base = "cad5de9f25593abeb21dc0cdfd4fef00e0a6f2ea"
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{base}..HEAD"], text=True).splitlines())
          allowed = {
              ".github/workflows/cwc-017-semantic-binding-repair.yml",
              ".github/workflows/cwc-017-semantic-binding-repair-v2.yml",
          }
          if not changed.issubset(allowed):
              raise SystemExit(f"unexpected pre-repair changes: {sorted(changed - allowed)}")

          p = Path("src/council/playwright-council-driver.ts")
          text = p.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected {label} shape: {text.count(old)}")
              text = text.replace(old, new)

          replace_once(
              '  assertAuthenticatedChatGptPage,\n  chatGptAssistantTurnSelector,\n} from "../chatgpt-session";',
              '  assertAuthenticatedChatGptPage,\n} from "../chatgpt-session";',
              "chatgpt-session import",
          )

          replace_once(
              '''interface CouncilResponseBinding {\n  identity: string;\n  locator: Locator;\n  acceptedTurnIdentities: readonly string[];\n}\n''',
              '''interface CouncilResponseBinding {\n  identity: string;\n  acceptedTurnIdentities: readonly string[];\n}\n\nexport function councilAssistantCandidateIndex(\n  identity: string,\n  candidateIdentities: readonly (string | undefined)[],\n): number | undefined {\n  const matches: number[] = [];\n  candidateIdentities.forEach((candidate, index) => {\n    if (candidate === identity) matches.push(index);\n  });\n  if (matches.length > 1) {\n    throw new Error(`ChatGPT exposed ${matches.length} semantic assistant DOM candidates for logical turn ${identity}`);\n  }\n  return matches[0];\n}\n\nasync function resolveCouncilAssistantTurn(page: Page, identity: string): Promise<Locator | undefined> {\n  const candidates = page.locator(CHATGPT_ASSISTANT_TURN_SELECTOR);\n  const identities = await candidates.evaluateAll(elements => elements.map(element => {\n    const groupKey = element.getAttribute("data-turn-key");\n    if (groupKey) return `group:assistant:${groupKey}`;\n    return element.getAttribute("data-turn-id")\n      ?? element.getAttribute("data-testid")\n      ?? element.closest("[data-turn-id-container]")?.getAttribute("data-turn-id-container")\n      ?? undefined;\n  }));\n  const index = councilAssistantCandidateIndex(identity, identities);\n  return index === undefined ? undefined : candidates.nth(index);\n}\n''',
              "response binding interface",
          )

          replace_once(
              '''async function reconcileCouncilResponseBinding(\n  page: Page,\n  baseline: CouncilTurnDomState,\n  prompt: string,\n  binding: CouncilResponseBinding | undefined,\n  acceptedUserIdentity?: string,\n): Promise<{ binding?: CouncilResponseBinding; state: CouncilTurnDomState }> {\n  const state = await councilTurnDomState(page);\n  if (!binding) {\n    const identity = councilNewTurnIdentity(baseline.turnIdentities, state.responseIdentities);\n    return {\n      binding: identity ? { identity, locator: page.locator(chatGptAssistantTurnSelector(identity)), acceptedTurnIdentities: state.turnIdentities } : undefined,\n      state,\n    };\n  }\n\n  const boundCount = await binding.locator.count();\n  if (boundCount === 1) return { binding, state };\n  if (boundCount > 1) throw new Error(`ChatGPT exposed ${boundCount} DOM nodes for the bound assistant turn`);\n''',
              '''async function reconcileCouncilResponseBinding(\n  page: Page,\n  baseline: CouncilTurnDomState,\n  prompt: string,\n  binding: CouncilResponseBinding | undefined,\n  acceptedUserIdentity?: string,\n): Promise<{ binding?: CouncilResponseBinding; state: CouncilTurnDomState; responseTurn?: Locator }> {\n  const state = await councilTurnDomState(page);\n  if (!binding) {\n    const identity = councilNewTurnIdentity(baseline.turnIdentities, state.responseIdentities);\n    const responseTurn = identity ? await resolveCouncilAssistantTurn(page, identity) : undefined;\n    return {\n      binding: identity ? { identity, acceptedTurnIdentities: state.turnIdentities } : undefined,\n      state,\n      responseTurn,\n    };\n  }\n\n  // Resolve the logical identity only across nodes that already satisfy the semantic assistant-turn\n  // selector. A legacy ChatGPT turn may mirror the same id through data-testid/data-turn-id/\n  // data-turn-id-container on nested nodes; those attribute aliases are not separate responses.\n  const boundTurn = await resolveCouncilAssistantTurn(page, binding.identity);\n  if (boundTurn) return { binding, state, responseTurn: boundTurn };\n''',
              "reconcile head",
          )

          replace_once('  if (!user) return { binding, state };', '  if (!user) return { binding, state, responseTurn: undefined };', "no-user reconciliation")
          replace_once('  if (!identity) return { binding, state };', '  if (!identity) return { binding, state, responseTurn: undefined };', "no-identity reconciliation")

          replace_once(
              '''  return {\n    binding: { identity, locator: page.locator(chatGptAssistantTurnSelector(identity)), acceptedTurnIdentities: state.turnIdentities },\n    state,\n  };''',
              '''  return {\n    binding: { identity, acceptedTurnIdentities: state.turnIdentities },\n    state,\n    responseTurn: await resolveCouncilAssistantTurn(page, identity),\n  };''',
              "replacement binding",
          )

          replace_once(
              '    if (identity) responseBinding = { identity, locator: page.locator(chatGptAssistantTurnSelector(identity)), acceptedTurnIdentities: state.turnIdentities };',
              '    if (identity) responseBinding = { identity, acceptedTurnIdentities: state.turnIdentities };',
              "initial binding",
          )

          replace_once(
              '''    responseBinding = reconciled.binding;\n    const present = Boolean(responseBinding && await responseBinding.locator.count() === 1);\n    const observation = present ? await currentResponseObservation(responseBinding!.locator) : { text: "", completion: false };''',
              '''    responseBinding = reconciled.binding;\n    const responseTurn = reconciled.responseTurn;\n    const present = Boolean(responseTurn);\n    const observation = responseTurn ? await currentResponseObservation(responseTurn) : { text: "", completion: false };''',
              "response observation",
          )

          p.write_text(text, encoding="utf-8")

          t = Path("tests/council-playwright-response-binding.test.ts")
          tests = t.read_text(encoding="utf-8")
          old_import = 'import { councilNewTurnIdentity, councilReboundTurnIdentity } from "../src/council/playwright-council-driver";'
          new_import = 'import { councilAssistantCandidateIndex, councilNewTurnIdentity, councilReboundTurnIdentity } from "../src/council/playwright-council-driver";'
          if tests.count(old_import) != 1:
              raise SystemExit("unexpected response-binding test import")
          tests = tests.replace(old_import, new_import)
          marker = '  test("logical assistant identity rejects competing responses and permits one replacement", () => {'
          inserted = '''  test("logical identity resolves only semantic assistant candidates", () => {\n    expect(councilAssistantCandidateIndex("conversation-turn-7", ["conversation-turn-6", "conversation-turn-7"])).toBe(1);\n    expect(councilAssistantCandidateIndex("conversation-turn-7", ["conversation-turn-6"])).toBeUndefined();\n    expect(() => councilAssistantCandidateIndex("conversation-turn-7", ["conversation-turn-7", "conversation-turn-7"]))\n      .toThrow("2 semantic assistant DOM candidates");\n  });\n\n''' + marker
          if tests.count(marker) != 1:
              raise SystemExit("unexpected response-binding test marker")
          tests = tests.replace(marker, inserted)
          t.write_text(tests, encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/council/playwright-council-driver.ts tests/council-playwright-response-binding.test.ts
          git commit -m "fix: resolve Council replies through semantic assistant turns"
          git push origin HEAD:cwc-personal

  validate:
    needs: patch
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen root install
        run: bun install --frozen-lockfile
      - name: Frozen launcher install
        run: bun install --cwd launcher --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Focused response-binding regressions
        run: bun test tests/council-playwright-response-binding.test.ts tests/council-chatgpt-deep-state.test.ts tests/council-playwright-prompt.test.ts tests/council-node-playwright-helper.test.ts tests/council-browser-transport.test.ts tests/council-execution-browser-integration.test.ts tests/council-autonomy-errors.test.ts tests/council-launcher-turn-control.test.ts tests/council-playwright-surface.test.ts
      - name: Full verify
        run: bun run verify
      - name: Direct Node helper CDP regression
        run: node scripts/qa-cwc-council-helper-cdp.mjs
      - name: Local Council runtime security smoke
        run: node scripts/qa-cwc-local-runtime.mjs
      - name: Integrity
        shell: pwsh
        run: |
          git diff --exit-code -- bun.lock launcher/bun.lock
          if (git status --short) {
            git status --short
            throw "Tracked worktree changed during CWC-017 semantic binding validation"
          }
