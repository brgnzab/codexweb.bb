name: CWC-014 Runtime Hygiene Validation

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install root
        run: bun install --frozen-lockfile
      - name: Frozen install launcher
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Root typecheck
        run: bun run typecheck
      - name: Focused public hygiene tests
        run: bun test tests/public-hygiene.test.ts
      - name: Public hygiene scan
        run: bun run scripts/check-public-hygiene.ts
      - name: Root tests
        run: bun run test
      - name: Launcher typecheck
        run: bun run launcher:typecheck
      - name: Focused launcher hygiene tests
        run: node --test launcher/tests/logging.test.cjs launcher/tests/cwc-runtime-hygiene.test.cjs
      - name: Launcher active tests
        run: bun run launcher:test
      - name: Launcher build
        run: bun run launcher:build
      - name: Windows package
        run: bun run app:package
      - name: Package smoke
        run: bun run app:smoke
