name: V5 Runtime Reparse Diagnostic

on:
  push:
    branches: [v5-runtime-reparse-diagnostic]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Recreate generated runtime dependency tree
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "runtime-diag"
          $app = Join-Path $out "app"
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Copy-Item package.json,bun.lock -Destination $app
          Push-Location $app
          try {
            bun install --production --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $points = Get-ChildItem -LiteralPath $out -Recurse -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue
          if (-not $points) {
            Write-Host "NO_REPARSE_POINTS"
          } else {
            foreach ($item in $points) {
              Write-Host ("REPARSE " + $item.FullName + " | LinkType=" + $item.LinkType + " | Target=" + ($item.Target -join ";"))
            }
          }
