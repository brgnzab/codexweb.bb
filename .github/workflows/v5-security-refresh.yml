name: V5 Security Refresh

on:
  push:
    branches: [v5-security-refresh]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Refresh root lockfile only
        run: bun install --lockfile-only
      - name: Verify frozen root install
        run: bun install --frozen-lockfile
      - name: Verify frozen launcher install
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Audit refreshed dependency graph
        run: bun audit
      - name: Commit generated lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if (git diff --cached --quiet) {
            Write-Host "No lockfile change"
            exit 0
          }
          git commit -m "security: refresh V5 dependency lock"
          git push origin HEAD:v5-security-refresh
