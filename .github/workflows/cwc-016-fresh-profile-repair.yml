name: CWC-016 Fresh Profile Repair

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frozen root install
        run: bun install --frozen-lockfile

      - name: Frozen launcher install
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Focused fresh-profile regression
        run: node --test launcher/tests/cwc-fresh-profile-source-run.test.cjs launcher/tests/council-owner-client.test.cjs launcher/tests/council-connection-supervisor.test.cjs

      - name: Launcher typecheck
        run: bun run launcher:typecheck

      - name: Launcher build
        run: bun run launcher:build

      - name: PowerShell source preflight
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start-cwc.ps1 -ValidateOnly -SkipInstall

      - name: Full verify
        run: bun run verify

      - name: Final integrity
        shell: powershell
        run: |
          git diff --exit-code -- bun.lock launcher/bun.lock
          if (git status --porcelain) { git status --short; exit 1 }
