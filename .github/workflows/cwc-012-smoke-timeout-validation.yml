name: CWC-012 Cold Smoke Validation

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install root
        run: bun install --frozen-lockfile
      - name: Frozen install launcher
        working-directory: launcher
        run: bun install --frozen-lockfile
      - name: Timeout contract test
        run: node --test launcher/tests/packaging-contract.test.cjs
      - name: Prepare Windows baseline Bun
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.3.14 -GitHubEnv $env:GITHUB_ENV
      - name: Package
        run: bun run app:package
      - name: Cold packaged smoke
        run: bun run app:smoke
