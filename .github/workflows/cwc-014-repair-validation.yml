name: CWC-014 Repair Validation

on:
  push:
    branches: [cwc-personal]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cwc-personal
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Refresh root lockfile for exact security overrides
        shell: pwsh
        run: |
          bun install --lockfile-only
          git diff -- bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh audited security lockfile"
            git push origin HEAD:cwc-personal
          }
          Write-Host "VALIDATED_HEAD=$(git rev-parse HEAD)"

      - name: Frozen install root
        run: bun install --frozen-lockfile
      - name: Frozen install launcher
        working-directory: launcher
        run: bun install --frozen-lockfile

      - name: Focused public hygiene tests
        run: bun test tests/public-hygiene.test.ts
      - name: Public hygiene scan
        run: bun run scripts/check-public-hygiene.ts
      - name: Root audit
        run: bun audit
      - name: Launcher audit
        working-directory: launcher
        run: bun audit

      - name: Full verify
        run: bun run verify
      - name: Windows package
        run: bun run app:package
      - name: Package smoke
        run: bun run app:smoke

      - name: Final repository integrity
        shell: pwsh
        run: |
          git status --short
          git diff --exit-code -- bun.lock launcher/bun.lock
          Write-Host "FINAL_VALIDATED_HEAD=$(git rev-parse HEAD)"
