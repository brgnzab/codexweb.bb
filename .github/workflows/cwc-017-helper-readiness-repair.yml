name: CWC-017 Helper Readiness Repair

on:
  push:
    branches:
      - cwc-personal
    paths:
      - .github/workflows/cwc-017-helper-readiness-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply helper readiness repair
        shell: python
        run: |
          from pathlib import Path

          driver = Path('src/council/node-playwright-council-driver.ts')
          text = driver.read_text(encoding='utf-8')

          old = 'import type { CouncilExecutionPhase } from "./autonomy-errors";'
          new = 'import { CouncilAutonomyError, type CouncilExecutionPhase } from "./autonomy-errors";'
          if old not in text:
              raise SystemExit('driver autonomy import anchor missing')
          text = text.replace(old, new, 1)

          old = '''function boundedDiagnostic(value: string): string {\n  return value.replace(/[\\r\\n\\t]+/g, " ").trim().slice(-2_000);\n}\n'''
          new = '''function boundedDiagnostic(value: string): string {\n  return value.replace(/[\\r\\n\\t]+/g, " ").trim().slice(-2_000);\n}\n\nfunction helperConnectionError(message: string): CouncilAutonomyError {\n  return new CouncilAutonomyError("CONNECTION_FAILED", boundedDiagnostic(message), true);\n}\n'''
          if old not in text:
              raise SystemExit('driver diagnostic anchor missing')
          text = text.replace(old, new, 1)

          old = '  constructor(private readonly descriptorPath: string) {}'
          new = '''  constructor(\n    private readonly descriptorPath: string,\n    private readonly helperReadyTimeoutMs = 15_000,\n  ) {\n    if (!Number.isFinite(helperReadyTimeoutMs) || helperReadyTimeoutMs < 1 || helperReadyTimeoutMs > 120_000) {\n      throw new Error("Council browser helper readiness timeout is invalid");\n    }\n  }'''
          if old not in text:
              raise SystemExit('driver constructor anchor missing')
          text = text.replace(old, new, 1)

          replacements = {
            'if (child.exitCode !== null || child.signalCode !== null || child.killed) throw new Error("Council browser helper exited before request dispatch");':
              'if (child.exitCode !== null || child.signalCode !== null || child.killed) throw helperConnectionError("Council browser helper exited before request dispatch");',
            'child.once("error", error => fail(new Error(`Council browser helper process failed: ${error.message}`)));':
              'child.once("error", error => fail(helperConnectionError(`Council browser helper process failed: ${error.message}`)));',
            'child.stdin.once("error", error => fail(new Error(`Council browser helper input failed: ${error.message}`)));':
              'child.stdin.once("error", error => fail(helperConnectionError(`Council browser helper input failed: ${error.message}`)));',
            'fail(new Error(`Council browser helper exited ${signal ? `from signal ${signal}` : `with status ${code ?? 1}`}${stderrTail ? `: ${stderrTail}` : ""}`));':
              'fail(helperConnectionError(`Council browser helper exited ${signal ? `from signal ${signal}` : `with status ${code ?? 1}`}${stderrTail ? `: ${stderrTail}` : ""}`));',
            'readyTimer = setTimeout(() => fail(new Error(`Council browser helper did not become ready${stderrTail ? `: ${stderrTail}` : ""}`)), 15_000);':
              'readyTimer = setTimeout(() => fail(helperConnectionError(`Council browser helper did not become ready${stderrTail ? `: ${stderrTail}` : ""}`)), this.helperReadyTimeoutMs);',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'driver replacement anchor missing: {before[:80]}')
              text = text.replace(before, after, 1)

          old = '''          if (message.type === "ready") {\n            if (sent) return;\n            if (input.signal?.aborted) {\n              fail(new DOMException("Council ChatGPT turn aborted", "AbortError"));\n              return;\n            }\n            sent = true;\n            try {'''
          new = '''          if (message.type === "ready") {\n            if (sent) return;\n            if (readyTimer) {\n              clearTimeout(readyTimer);\n              readyTimer = undefined;\n            }\n            if (input.signal?.aborted) {\n              fail(new DOMException("Council ChatGPT turn aborted", "AbortError"));\n              return;\n            }\n            sent = true;\n            input.onExecution?.({\n              type: "health",\n              health: "healthy",\n              note: "launcher browser helper protocol ready",\n            });\n            try {'''
          if old not in text:
              raise SystemExit('driver ready branch anchor missing')
          text = text.replace(old, new, 1)
          driver.write_text(text, encoding='utf-8')

          tests = Path('tests/council-node-playwright-helper.test.ts')
          text = tests.read_text(encoding='utf-8')
          old = 'function fixture(mode: "success" | "conversation-missing" = "success") {'
          new = 'function fixture(mode: "success" | "conversation-missing" | "delayed-success" = "success") {'
          if old not in text:
              raise SystemExit('helper test fixture anchor missing')
          text = text.replace(old, new, 1)

          old = '''      if (${JSON.stringify(mode)} === "conversation-missing") {\n        send({ type: "council-error", id: message.id, name: "CouncilConversationUnavailableError", message: "missing conversation" });\n        return;\n      }\n      send({ type: "council-event", id: message.id, observation: { type: "phase", phase: "conversation-ready" } });\n      send({ type: "council-event", id: message.id, observation: { type: "deep-state", state: "THINKING", confidence: 0.75, reason: "helper telemetry" } });\n      send({ type: "council-result", id: message.id, value: { answer: "relay-ok", conversationUrl: "https://chatgpt.com/c/helper-test" } });'''
          new = '''      if (${JSON.stringify(mode)} === "conversation-missing") {\n        send({ type: "council-error", id: message.id, name: "CouncilConversationUnavailableError", message: "missing conversation" });\n        return;\n      }\n      const complete = () => {\n        send({ type: "council-event", id: message.id, observation: { type: "phase", phase: "conversation-ready" } });\n        send({ type: "council-event", id: message.id, observation: { type: "deep-state", state: "THINKING", confidence: 0.75, reason: "helper telemetry" } });\n        send({ type: "council-result", id: message.id, value: { answer: "relay-ok", conversationUrl: "https://chatgpt.com/c/helper-test" } });\n      };\n      if (${JSON.stringify(mode)} === "delayed-success") setTimeout(complete, 100);\n      else complete();'''
          if old not in text:
              raise SystemExit('helper fake response anchor missing')
          text = text.replace(old, new, 1)

          old = '''  expect(observations).toEqual([\n    { type: "phase", phase: "conversation-ready" },\n    { type: "deep-state", state: "THINKING", confidence: 0.75, reason: "helper telemetry" },\n  ]);'''
          new = '''  expect(observations).toEqual([\n    { type: "health", health: "healthy", note: "launcher browser helper protocol ready" },\n    { type: "phase", phase: "conversation-ready" },\n    { type: "deep-state", state: "THINKING", confidence: 0.75, reason: "helper telemetry" },\n  ]);'''
          if old not in text:
              raise SystemExit('helper observation expectation anchor missing')
          text = text.replace(old, new, 1)

          text += '''\n\ntest("helper readiness deadline ends at the ready handshake rather than the completed turn", async () => {\n  const { descriptorPath } = fixture("delayed-success");\n  const driver = new NodePlaywrightCouncilChatDriver(descriptorPath, 25);\n  const observations: unknown[] = [];\n  const result = await driver.create({\n    surfaceId: "launcher_surface_id_0123456789AB",\n    prompt: "CWC-017 delayed managed turn",\n    onExecution: observation => observations.push(observation),\n  });\n  expect(result).toEqual({ answer: "relay-ok", conversationUrl: "https://chatgpt.com/c/helper-test" });\n  expect(observations[0]).toEqual({ type: "health", health: "healthy", note: "launcher browser helper protocol ready" });\n});\n'''
          tests.write_text(text, encoding='utf-8')

          errors = Path('tests/council-autonomy-errors.test.ts')
          text = errors.read_text(encoding='utf-8')
          marker = '''  test("does not treat an unknown error as retryable", () => {'''
          addition = '''  test("maps helper readiness loss to a pre-submit connection failure", () => {\n    expect(classifyCouncilFailure(new Error("Council browser helper did not become ready"))).toEqual({\n      code: "CONNECTION_FAILED",\n      retryableBeforeSubmit: true,\n    });\n  });\n\n'''
          if marker not in text:
              raise SystemExit('autonomy error test anchor missing')
          text = text.replace(marker, addition + marker, 1)
          errors.write_text(text, encoding='utf-8')

          autonomy = Path('src/council/autonomy-errors.ts')
          text = autonomy.read_text(encoding='utf-8')
          old = '''  if (/network|connection|failed to fetch|ECONN|socket|timed out|timeout/i.test(text)) {\n    return { code: "CONNECTION_FAILED", retryableBeforeSubmit: true };\n  }'''
          new = '''  if (/network|connection|failed to fetch|ECONN|socket|timed out|timeout|Council browser helper did not become ready|Council browser helper process failed|Council browser helper input failed|Council browser helper exited/i.test(text)) {\n    return { code: "CONNECTION_FAILED", retryableBeforeSubmit: true };\n  }'''
          if old not in text:
              raise SystemExit('autonomy classification anchor missing')
          text = text.replace(old, new, 1)
          autonomy.write_text(text, encoding='utf-8')

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          git diff -- src/council/node-playwright-council-driver.ts src/council/autonomy-errors.ts tests/council-node-playwright-helper.test.ts tests/council-autonomy-errors.test.ts
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/council/node-playwright-council-driver.ts src/council/autonomy-errors.ts tests/council-node-playwright-helper.test.ts tests/council-autonomy-errors.test.ts
          git commit -m "fix: end Council helper readiness deadline on handshake"
          git push origin HEAD:cwc-personal

  validate:
    needs: patch
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen root install
        shell: pwsh
        run: bun install --frozen-lockfile
      - name: Frozen launcher install
        shell: pwsh
        run: bun install --cwd launcher --frozen-lockfile
      - name: Typecheck
        shell: pwsh
        run: bun run typecheck
      - name: Focused repair tests
        shell: pwsh
        run: >-
          bun test
          tests/council-node-playwright-helper.test.ts
          tests/council-autonomy-errors.test.ts
          tests/council-browser-transport.test.ts
          tests/council-execution-control-plane.test.ts
          tests/council-local-setup.test.ts
          tests/council-product-mode-contract.test.ts
          tests/council-launcher-turn-control.test.ts
          tests/council-playwright-surface.test.ts
      - name: Full verify
        shell: pwsh
        run: bun run verify
      - name: Direct Node helper CDP regression
        shell: pwsh
        run: node scripts/qa-cwc-council-helper-cdp.mjs
      - name: Local Council runtime security smoke
        shell: pwsh
        run: node scripts/qa-cwc-local-runtime.mjs
      - name: Integrity
        shell: pwsh
        run: |
          git diff --exit-code -- bun.lock launcher/bun.lock
          if (git status --short) {
            git status --short
            throw "Tracked worktree changed during CWC-017 helper-readiness validation"
          }
