name: CWC-017 Node Helper Validation

on:
  push:
    branches:
      - cwc-personal
    paths:
      - .github/workflows/cwc-017-node-helper-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen root install
        shell: pwsh
        run: bun install --frozen-lockfile
      - name: Frozen launcher install
        shell: pwsh
        run: bun install --cwd launcher --frozen-lockfile
      - name: Typecheck
        shell: pwsh
        run: bun run typecheck
      - name: Focused Council tests
        shell: pwsh
        run: >-
          bun test
          tests/council-node-playwright-helper.test.ts
          tests/council-browser-transport.test.ts
          tests/council-local-setup.test.ts
          tests/council-product-mode-contract.test.ts
          tests/council-launcher-turn-control.test.ts
          tests/council-playwright-surface.test.ts
      - name: Full verify
        shell: pwsh
        run: bun run verify
      - name: Actual Council Node helper CDP probe
        shell: pwsh
        run: node scripts/qa-cwc-council-helper-cdp.mjs
      - name: Integrity
        shell: pwsh
        run: |
          git diff --exit-code -- bun.lock launcher/bun.lock
          if (git status --short) {
            git status --short
            throw "Tracked worktree changed during CWC-017 Node helper validation"
          }
