name: CWC-017 Response Binding Bootstrap

on:
  push:
    branches: [cwc-personal]
    paths: [.github/workflows/cwc-017-response-binding-bootstrap.yml]

permissions:
  contents: write

jobs:
  repair-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cwc-personal
          fetch-depth: 0
      - name: Correct repair gate
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          base = "7cf956a128e85a27f7a4d0ac6025dbb0dd05acc9"
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          changed_since_base = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          allowed = {
              ".github/workflows/cwc-017-response-binding-repair.yml",
              ".github/workflows/cwc-017-response-binding-bootstrap.yml",
          }
          if not changed_since_base.issubset(allowed):
              raise SystemExit(f"unexpected changes before repair: {sorted(changed_since_base - allowed)}")

          p = Path('.github/workflows/cwc-017-response-binding-repair.yml')
          text = p.read_text(encoding='utf-8')

          guard_pattern = re.compile(
              r'          expected = "7cf956a128e85a27f7a4d0ac6025dbb0dd05acc9"\n'
              r'          import subprocess\n'
              r'          head = subprocess\.check_output\(\["git", "rev-parse", "HEAD"\], text=True\)\.strip\(\)\n'
              r'          if head != expected:\n'
              r'              raise SystemExit\(f"unexpected parent \{head\}; expected \{expected\}"\)'
          )
          replacement = '''          import subprocess
          base = "7cf956a128e85a27f7a4d0ac6025dbb0dd05acc9"
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          staged = set(subprocess.check_output(["git", "diff", "--name-only", f"{base}..HEAD"], text=True).splitlines())
          allowed_staging = {
              ".github/workflows/cwc-017-response-binding-repair.yml",
              ".github/workflows/cwc-017-response-binding-bootstrap.yml",
          }
          if not staged.issubset(allowed_staging):
              raise SystemExit(f"unexpected pre-repair changes: {sorted(staged - allowed_staging)}")'''
          text, count = guard_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one parent guard, replaced {count}")

          indent = " " * 12
          needle = indent + "let matches = false;\n" + indent + "if (replacement && identity && user) {"
          injected = (
              indent + "// Activity may temporarily unmount the bound assistant group before its persisted\n"
              + indent + "// replacement appears. With no competing new turn, preserve the logical binding and\n"
              + indent + "// let positive generation liveness/grace absorb that renderer transition.\n"
              + indent + "if (!identity && newUsers.length === 0) return { binding, state };\n\n"
              + needle
          )
          if text.count(needle) != 1:
              raise SystemExit(f"expected one transient-binding insertion point, found {text.count(needle)}")
          text = text.replace(needle, injected)

          required_at = text.find("          required = {")
          if required_at < 0:
              raise SystemExit("patch-shape required block not found")
          prefix, suffix = text[:required_at], text[required_at:]
          workflow_line = '              ".github/workflows/cwc-017-response-binding-repair.yml",\n'
          if suffix.count(workflow_line) != 1:
              raise SystemExit(f"expected one workflow entry in required block, found {suffix.count(workflow_line)}")
          text = prefix + suffix.replace(workflow_line, "", 1)

          p.write_text(text, encoding='utf-8')
          subprocess.run(["git", "diff", "--check"], check=True)
      - name: Commit gate correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cwc-017-response-binding-repair.yml
          git commit -m "chore: fix CWC-017 response-binding repair gate"
          git push origin HEAD:cwc-personal
