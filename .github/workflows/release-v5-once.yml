name: V5 Release Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v5-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify V5 release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.version' package.json)" = "5.0.0"
          test "$(jq -r '.version' launcher/package.json)" = "5.0.0"
      - name: Dispatch approved V5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f approve_publish=true
